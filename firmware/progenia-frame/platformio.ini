; ProGenia AR Slice — XIAO ESP32-C6 / C3 + BNO085
;
; Build C6:  pio run -d firmware/progenia-frame -e seeed_xiao_esp32c6
; Build C3:  pio run -d firmware/progenia-frame -e seeed_xiao_esp32c3
; Upload C3: firmware/progenia-frame/upload.sh seeed_xiao_esp32c3

[platformio]
default_envs = seeed_xiao_esp32c6

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
lib_deps =
  adafruit/Adafruit BNO08x @ ^1.2.5
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DFRAME_SERIAL_DEBUG=1
  -DFRAME_WIFI_ENABLED=1
  -DFRAME_BLE_ENABLED=1
  -DFRAME_SOFTAP_ENABLED=0
  -DFRAME_WIFI_NOTIFY_INTERVAL_MS=20

[env:seeed_xiao_esp32c6]
board = seeed_xiao_esp32c6

[env:seeed_xiao_esp32c3]
board = seeed_xiao_esp32c3
